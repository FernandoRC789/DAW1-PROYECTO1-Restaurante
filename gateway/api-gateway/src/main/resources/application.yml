server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # --- CONFIGURACIÓN DE CORS PARA ANGULAR ---
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # ------------------------------------------
      routes:
        # 1. Ruta para el microservicio de Autenticación y Seguridad
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # 2. Ruta para el microservicio de Usuarios
        - id: users-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/usuarios/**

        # 3. Ruta para el microservicio de Facturación / Cobros
        - id: billing-service-route
          uri: lb://billing-service
          predicates:
            - Path=/api/comprobantes/**

        # 4. Ruta para el microservicio de Operaciones (Mesas)
        - id: operations-service-route
          uri: lb://operations-service
          predicates:
            - Path=/api/mesas/**

        # 5. Ruta para el microservicio de Catálogo (Comidas y Categorías)
        # 5.1. Ruta para el Catálogo (Categorías)
        - id: categorias-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/categorias/**

        # 5.2. Ruta para el Catálogo (Comidas)
        - id: comidas-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/comidas/**

        # 6. Ruta para el microservicio de Clientes
        - id: customers-service-route
          uri: lb://customer-service
          predicates:
            - Path=/api/clientes/**

        # 7. Ruta para el microservicio de Pedidos / Órdenes
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/pedidos/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true