<div class="container login-fastfood">
  <h3 class="text-center text-dark">🍽️🍔 Bienvenido</h3>

  <form (ngSubmit)="login()">
    <br>
    <div class="mb-3">
      <label>Usuario</label>
      <input [(ngModel)]="username" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
    </div>

    <button class="btn btn-primary w-100 btn-orange">Ingresar</button>
  </form>

</div>
