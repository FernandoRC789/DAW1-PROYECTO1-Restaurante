<div class="container mt-3">

  <h3>👨‍🍳 Pedidos Cocina</h3>

<select class="form-select"
        [(ngModel)]="filtroEstado"
        (change)="aplicarFiltro()">

  <option value="TODOS">Todos</option>
  <option value="PENDIENTE">Pendiente</option>
  <option value="EN_COCINA">En proceso</option>
  <option value="LISTO">Listo</option>

</select>
<br>

<div *ngFor="let p of pedidos" class="card mb-3 p-3 shadow-sm">

<!-- ✅ Mesa enriquecida desde el backend -->
  <h5>🍽️ Mesa {{ p.mesaNumero }}</h5>

<!-- ✅ Estado enriquecido desde el backend -->
    <span class="badge" [ngClass]="getColor(p.estadoNombre)">
      {{ p.estadoNombre }}
    </span>

  <hr>

  <h6>🧾 Pedido:</h6>

    <ul>
      <!-- ✅ Nombre de la comida enriquecido desde el backend -->
      <li *ngFor="let d of p.detallePedido">
        {{ d.comidaNombre }} x {{ d.cantidad }}
      </li>
    </ul>

  <div class="mt-2">
  <button class="btn btn-warning btn-sm me-2"
          [disabled]="p.estadoNombre !== 'PENDIENTE'"
          (click)="cambiarEstadoPedido(p.idPedido, 2)">
    🔥 En preparación
  </button>

      <button class="btn btn-success btn-sm"
              [disabled]="p.estadoNombre !== 'EN_COCINA'"
              (click)="cambiarEstadoPedido(p.idPedido, 3)">
        ✔ Listo
      </button>

  </div>
</div>
<div class="mt-2 text-end">

</div>
</div>
