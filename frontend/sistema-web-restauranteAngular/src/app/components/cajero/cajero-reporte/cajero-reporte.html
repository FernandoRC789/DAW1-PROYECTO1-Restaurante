<div class="container mt-3">

  <h3>💰 CAJA - POS RESTAURANTE</h3>

  <!-- 📊 RESUMEN -->
  <div class="alert alert-info">
    💵 Total caja: S/. {{ totalCaja }}
  </div>

  <!-- 🔎 FILTROS -->
  <div class="row mb-2">

    <div class="col">
      <input class="form-control"
             placeholder="🔎 Buscar número..."
             [(ngModel)]="filtroTexto"
             (input)="aplicarFiltro()">
    </div>

    <div class="col">
      <select class="form-select"
              [(ngModel)]="metodoFiltro"
              (change)="aplicarFiltro()">

        <option value="TODOS">Todos</option>
        <option value="EFECTIVO">Efectivo</option>
        <option value="TARJETA">Tarjeta</option>
        <option value="YAPE">Yape</option>

      </select>
    </div>

  </div>

  <!-- 📄 TABLA -->
  <table class="table table-hover">

    <thead>
      <tr>
        <th>Número</th>
        <th>Total</th>
        <th>Método</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let c of comprobantes">

        <td>{{ c.numero }}</td>
        <td>S/. {{ c.total }}</td>
        <td>{{ c.metodoPago }}</td>

        <td>
          <span class="badge bg-success">
            {{ c.estado?.nombre }}
          </span>
        </td>

        <td>

          <button class="btn btn-danger btn-sm"
                  (click)="anular(c.idComprobantePago)">
            ❌ Anular
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>
