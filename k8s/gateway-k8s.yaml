apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_CLOUD_CONFIG_ENABLED
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort # Esto te permite exponerlo si necesitas probarlo desde fuera
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
  selector:
    app: api-gateway