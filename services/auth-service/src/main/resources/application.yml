server:
  port: 8082

spring:
  application:
    name: auth-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    # Forzamos a que se registre con localhost para evitar líos de IP en local
    hostname: localhost