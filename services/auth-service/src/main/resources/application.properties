spring.application.name=auth-service

#Configurando los parametros de la base de datos MySql Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Lee la contrasena de una variable de entorno llamada DB_PASSWORD
spring.datasource.password=${DB_PASSWORD_MYSQL:Root2026!}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hace que el codigo SQL que se imprime en la consola aparezca ordenado
#con sangrias y bonitos saltos de linea
#en vez de salir como una linea horizontal gigante e ilegible.
#NO USAR EN PRODUCCION- para asi poder mantener LOGS LIMPIOS
spring.jpa.properties.hibernate.format_sql=true

#Define el "dialecto" o idioma que Hibernate va a utilizar para comunicarse con la base de datos.
#estas diciendo explicitamente a Hibernate: "Genera consultas SQL optimizadas y compatibles especificamente para MySQL".
#SE PUEDE ELIMINAR SIN PROBLEMAS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#crear tablas automaticamente utilizando Hibernate/JPA
#NO USARLO EN PRODUCCION - USAR VALIDATE O FLYWAY LIQUIBASE
spring.jpa.hibernate.ddl-auto=update

#Le ordena a Spring Boot que imprima en la consola de tu terminal/IDE
# las consultas SQL reales que Hibernate genera por detras cada vez que ejecutas una accion 
#(un guardado, una consulta, etc.). NO USARLO EN PRODUCCION 
spring.jpa.show-sql=true

#PUERTO DONDE CORRERA EL MICROSERVICIO DE AUTH SERVICE
server.port=8082
