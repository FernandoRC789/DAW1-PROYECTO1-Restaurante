spring.application.name=customer-service

# Base de datos propia del microservicio CUSTOMER
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

# La variable de entorno existente en Windows se llama exactamente customer-service
spring.datasource.password=${customer-service}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto definido por la arquitectura
server.port=8086

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
