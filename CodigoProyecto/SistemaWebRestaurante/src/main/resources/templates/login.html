<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Restaurante</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: #0f172a;
    padding: 40px;
    border-radius: 20px;
    width: 320px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
}

h2 {
    color: #22c55e;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    background: #020617;
    color: white;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #22c55e;
    border: none;
    border-radius: 10px;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}
</style>
</head>

<body>

<div class="container">
    <h2>🌙 Login</h2>
	<form th:action="@{/login}" method="post">
		<div>
			<label>Usuario:</label>
			<input type="text" name="username" placeholder="Ingresa tu usuario" />
		</div>

		<div>
			<label>Contraseña:</label>
			<input type="password" name="password" placeholder="Ingresa tu contraseña" />
		</div>

		<div>
			<button type="submit">Entrar</button>
		</div>
	</form>
</div>

</body>
</html>
