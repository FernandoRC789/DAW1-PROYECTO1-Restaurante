<!-- admin.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Panel de Administración</title>

	<style>
		body {
			margin: 0;
			font-family: 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, #0f172a, #1e293b);
			color: white;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}

		.container {
			background: #1e293b;
			padding: 40px;
			border-radius: 15px;
			width: 450px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
			text-align: center;
			animation: fadeIn 0.5s ease-in-out;
		}

		h1 {
			margin-bottom: 15px;
			color: #3b82f6;
		}

		p {
			font-size: 15px;
			opacity: 0.9;
			margin-bottom: 25px;
		}

		strong {
			color: #ef4444;
		}

		a {
			display: block;
			margin-bottom: 15px;
			padding: 10px;
			text-decoration: none;
			border-radius: 8px;
			font-weight: bold;
			background: #2563eb;
			color: white;
			transition: 0.3s;
		}

		a:hover {
			background: #1d4ed8;
		}

		button {
			width: 100%;
			padding: 12px;
			background: #f59e0b;
			border: none;
			border-radius: 8px;
			color: black;
			font-weight: bold;
			cursor: pointer;
			transition: 0.3s;
		}

		button:hover {
			background: #d97706;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>

<body>

	<div class="container">
		<h1>Bienvenido al Panel de Administración</h1>

		<p>Solo los usuarios con el rol <strong>ADMIN</strong> pueden ver esta página.</p>

		<a th:href="@{/}">Volver al inicio</a>

		<form th:action="@{/logout}" method="post">
			<button type="submit">Cerrar sesión</button>
		</form>
	</div>

</body>

</html>
