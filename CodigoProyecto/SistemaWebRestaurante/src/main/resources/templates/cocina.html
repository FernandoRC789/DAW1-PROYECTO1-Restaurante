<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cocina - Gestión de Comidas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .scroll-box {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <h2>👨‍🍳 Panel de Cocina</h2>

    <!-- FORMULARIO -->
    <div class="card p-3 mb-4">
        <h4>Solicitudes de Comidas</h4>


        <div class="mt-3">
            <button class="btn btn-success" onclick="crearComida()">💾 Guardar</button>
        </div>
    </div>

    <!-- LISTA -->
    <div class="card p-3">
        <h4>📋 Lista de Comidas</h4>

        <div class="scroll-box">
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Disponible</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaComidas"></tbody>
            </table>
        </div>
    </div>

</div>

<script>

let categorias = [];

// 🔥 CARGAR DATOS
document.addEventListener("DOMContentLoaded", () => {
    cargarCategorias();
    cargarComidas();
});

// 🔥 CATEGORÍAS
function cargarCategorias() {
    fetch("http://localhost:8080/api/categorias")
        .then(res => res.json())
        .then(data => {
            categorias = data;

            const select = document.getElementById("categoria");
            select.innerHTML = "";

            data.forEach(c => {
                select.innerHTML += `<option value="${c.idCat}">${c.nombre}</option>`;
            });
        });
}

// 🔥 COMIDAS
function cargarComidas() {
    fetch("http://localhost:8080/api/comidas")
        .then(res => res.json())
        .then(data => {
            renderTabla(data);
        });
}

// 🔥 RENDER TABLA
function renderTabla(lista) {

    const tabla = document.getElementById("tablaComidas");
    tabla.innerHTML = "";

    lista.forEach(c => {
        tabla.innerHTML += `
            <tr>
                <td>${c.nombre}</td>
                <td>S/ ${c.precioUni}</td>
                <td>
                    ${c.disponible 
                        ? '<span class="badge bg-success">Disponible</span>' 
                        : '<span class="badge bg-danger">Agotado</span>'}
                </td>
				<td>
				    <button class="btn btn-warning btn-sm"
				        onclick="toggleDisponible(${c.idComida}, ${c.disponible})">
				        Cambiar
				    </button>
				</td>
            </tr>
        `;
    });
}

// 🔥 CREAR COMIDA
function crearComida() {

    const comida = {
        nombre: document.getElementById("nombre").value,
        descripcion: document.getElementById("descripcion").value,
        precioUni: parseFloat(document.getElementById("precio").value),
        categoriaId: parseInt(document.getElementById("categoria").value),
        disponible: true
    };

    fetch("http://localhost:8080/api/comidas", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(comida)
    })
    .then(res => res.json())
    .then(() => {
        alert("✅ Comida creada");
        limpiarFormulario();
        cargarComidas();
    });
}

// 🔥 LIMPIAR
function limpiarFormulario() {
    document.getElementById("nombre").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("precio").value = "";
}

// 🔥 CAMBIAR DISPONIBLE
function toggleDisponible(id, estadoActual) {

    fetch(`http://localhost:8080/api/comidas/${id}/disponible?estado=${!estadoActual}`, {
        method: "PATCH"
    })
    .then(() => cargarComidas());
}
