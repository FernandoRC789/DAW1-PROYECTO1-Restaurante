spring.application.name=SistemaWebRestaurante

#Configurando los parametros de la base de datos MySql Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/db_SistemaWebRestaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Lee la contrasena de una variable de entorno llamada DB_PASSWORD
spring.datasource.password=${DB_PASSWORD_MYSQL}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081
